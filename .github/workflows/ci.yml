# CI: run the offline pytest suite on every push.
#
# The tests in tests/ are deliberately dependency-free (the modules they cover
# import only the stdlib), so CI needs nothing beyond pytest — no torch, no
# model downloads, no network, no GPU.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run offline test suite
        run: python -m pytest tests -q
